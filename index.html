<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética Click - Sistema de Gestão Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%); }
        .sidebar-active { background-color: #FFF0F5; color: #AA7C11; font-weight: bold; border-left: 4px solid #D4AF37; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>
    <div id="app" class="min-h-screen flex flex-col justify-between"></div>

    <script>
        // ==========================================
        // 1. ESTRUTURA DO BANCO DE DADOS LOCAL
        // ==========================================
        const DADOS_MOCK = {
            config: { usuario: "admin", senha: "123", chave: "ESTETICA2026", autenticado: false },
            financeiro: [
                { id: 1, descricao: "Procedimento Botox - Ana Silva", tipo: "entrada", valor: 1200.00, data: "2026-06-05" },
                { id: 2, descricao: "Preenchimento Labial (+ Protetor Bump)", tipo: "entrada", valor: 1549.90, data: "2026-06-06" },
                { id: 3, descricao: "Compra de Luvas e Microagulhas", tipo: "saida", valor: 150.00, data: "2026-06-07" },
                { id: 4, descricao: "Limpeza de Pele - Maria Souza", tipo: "entrada", valor: 180.00, data: "2026-06-08" }
            ],
            estoque: [
                { id: 1, nome: "Toxina Botulínica (Botox)", qtd: 5, custo: 450.00, venda: 1200.00 },
                { id: 2, nome: "Ácido Hialurônico 1ml", qtd: 2, custo: 300.00, venda: 1500.00 },
                { id: 3, nome: "Protetor Solar Facial Premium", qtd: 14, custo: 25.00, venda: 49.90 },
                { id: 4, nome: "Creme Hidratante Calmante", qtd: 1, custo: 40.00, venda: 90.00 }
            ],
            agendamentos: [
                { id: 1, cliente: "Ana Silva", whatsapp: "5511999999999", procedimento: "Botox", data: "2026-06-09", horario: "14:00", bump: false },
                { id: 2, cliente: "Maria Souza", whatsapp: "5511988888888", procedimento: "Limpeza de Pele", data: "2026-06-09", horario: "16:00", bump: true }
            ],
            clientesInativos: [
                { id: 1, nome: "Juliana Ribeiro", whatsapp: "5511977777777", ultimoProcedimento: "Preenchimento", dias: 45 },
                { id: 2, nome: "Carla Mendes", whatsapp: "5511966666666", ultimoProcedimento: "Limpeza de Pele", dias: 32 }
            ]
        };

        const PRECOS_PROCEDIMENTOS = {
            "Botox": 1200.00,
            "Preenchimento": 1500.00,
            "Limpeza de Pele": 180.00,
            "Massagem": 120.00
        };

        function lerDB() {
            if (!localStorage.getItem('estetica_click_db')) {
                localStorage.setItem('estetica_click_db', JSON.stringify(DADOS_MOCK));
            }
            return JSON.parse(localStorage.getItem('estetica_click_db'));
        }

        function gravarDB(dados) {
            localStorage.setItem('estetica_click_db', JSON.stringify(dados));
        }

        let telaAtiva = "dashboard";
        let graficoInstancia = null;

        function navegar(tela) {
            telaAtiva = tela;
            renderizarApp();
        }

        function mostrarToast(mensagem, tipo = "sucesso") {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-xl border text-sm font-semibold flex items-center gap-3 transition-all duration-300 transform translate-y-2 pointer-events-auto min-w-[280px] ${
                tipo === "sucesso" ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"
            }`;
            const icone = tipo === "sucesso" ? "fa-circle-check" : "fa-circle-exclamation";
            toast.innerHTML = `<i class="fa-solid ${icone} text-lg"></i> <span>${mensagem}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3500);
        }

        // ==========================================
        // 2. AUTENTICAÇÃO E AGENDAMENTO PÚBLICO
        // ==========================================
        function executarLogin(event) {
            event.preventDefault();
            const u = document.getElementById('l_user').value;
            const s = document.getElementById('l_pass').value;
            const k = document.getElementById('l_key').value;
            const db = lerDB();

            if (u === db.config.usuario && s === db.config.senha && k === db.config.chave) {
                db.config.autenticado = true;
                gravarDB(db);
                mostrarToast("Licença SaaS validada com sucesso!");
                renderizarApp();
            } else {
                mostrarToast("Usuário, senha ou chave inválidos!", "erro");
            }
        }

        function executarLogout() {
            const db = lerDB();
            db.config.autenticado = false;
            gravarDB(db);
            renderizarApp();
        }

        function gravarAgendamentoCliente(event) {
            event.preventDefault();
            const db = lerDB();
            
            const novoAgendamento = {
                id: Date.now(),
                cliente: document.getElementById('c_nome').value,
                whatsapp: document.getElementById('c_whats').value.replace(/\D/g, ''),
                procedimento: document.getElementById('c_proc').value,
                data: document.getElementById('c_data').value,
                horario: document.getElementById('c_hora').value,
                bump: document.getElementById('c_bump').checked
            };

            db.agendamentos.push(novoAgendamento);
            gravarDB(db);
            
            mostrarToast("Agendamento Premium Reservado com sucesso!");
            event.target.reset();
        }

        // ==========================================
        // 3. OPERAÇÕES DO BACKOFFICE ADMINISTRATIVO
        // ==========================================
        function adicionarProduto(event) {
            event.preventDefault();
            const db = lerDB();
            const novoItem = {
                id: Date.now(),
                nome: document.getElementById('p_nome').value,
                qtd: parseInt(document.getElementById('p_qtd').value),
                custo: parseFloat(document.getElementById('p_custo').value),
                venda: parseFloat(document.getElementById('p_venda').value)
            };
            db.estoque.push(novoItem);
            gravarDB(db);
            mostrarToast("Produto adicionado ao estoque!");
            renderizarApp();
        }

        function alterarEstoque(id, delta) {
            const db = lerDB();
            const item = db.estoque.find(i => i.id === id);
            if (item) {
                item.qtd = Math.max(0, item.qtd + delta);
                gravarDB(db);
                renderizarApp();
            }
        }

        function excluirProduto(id) {
            const db = lerDB();
            db.estoque = db.estoque.filter(i => i.id !== id);
            gravarDB(db);
            mostrarToast("Produto removido do estoque.");
            renderizarApp();
        }

        function concluirAgendamento(id) {
            const db = lerDB();
            const idx = db.agendamentos.findIndex(a => a.id === id);
            if (idx === -1) return;
            
            const agendamento = db.agendamentos[idx];
            const valorBase = PRECOS_PROCEDIMENTOS[agendamento.procedimento] || 100.00;
            
            db.financeiro.push({
                id: Date.now(),
                descricao: `Procedimento ${agendamento.procedimento} - ${agendamento.cliente}`,
                tipo: "entrada",
                valor: valorBase,
                data: new Date().toISOString().split('T')[0]
            });

            if (agendamento.bump) {
                db.financeiro.push({
                    id: Date.now() + 1,
                    descricao: `Venda Order Bump - Protetor Solar (${agendamento.cliente})`,
                    tipo: "entrada",
                    valor: 49.90,
                    data: new Date().toISOString().split('T')[0]
                });

                const protetor = db.estoque.find(i => i.id === 3 || i.nome.includes("Protetor"));
                if (protetor && protetor.qtd > 0) {
                    protetor.qtd -= 1;
                }
            }

            db.clientesInativos.push({
                id: Date.now(),
                nome: agendamento.cliente,
                whatsapp: agendamento.whatsapp,
                ultimoProcedimento: agendamento.procedimento,
                dias: 1
            });

            db.agendamentos.splice(idx, 1);
            gravarDB(db);
            mostrarToast("Atendimento finalizado e computado no caixa!");
            renderizarApp();
        }

        function excluirAgendamento(id) {
            const db = lerDB();
            db.agendamentos = db.agendamentos.filter(a => a.id !== id);
            gravarDB(db);
            mostrarToast("Agendamento removido.");
            renderizarApp();
        }

        function dispararWhatsApp(nome, whats, procedimento, dias) {
            const texto = `Olá ${nome}! Tudo bem? Notamos aqui no sistema que faz ${dias} dias desde o seu último procedimento de ${procedimento}. O visual deve estar precisando de uma renovação! Garanta seu horário exclusivo clicando no nosso link de agendamento online: ${window.location.href.split('?')[0]}?view=agendar`;
            const url = `https://api.whatsapp.com/send?phone=${whats}&text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        function adicionarMovimentoManual(event) {
            event.preventDefault();
            const db = lerDB();
            db.financeiro.push({
                id: Date.now(),
                descricao: document.getElementById('f_desc').value,
                tipo: document.getElementById('f_tipo').value,
                valor: parseFloat(document.getElementById('f_valor').value),
                data: document.getElementById('f_data').value
            });
            gravarDB(db);
            mostrarToast("Movimentação de caixa lançada!");
            renderizarApp();
        }

        function atualizarConfiguracoes(event) {
            event.preventDefault();
            const db = lerDB();
            db.config.usuario = document.getElementById('cfg_user').value;
            db.config.senha = document.getElementById('cfg_pass').value;
            db.config.chave = document.getElementById('cfg_key').value;
            gravarDB(db);
            mostrarToast("Configurações atualizadas!");
            renderizarApp();
        }

        function realizarBackup() {
            const db = lerDB();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `backup_estetica_click.json`);
            dlAnchorElem.click();
        }

        // ==========================================
        // 4. RENDERIZADOR DO CORE DA APLICAÇÃO
        // ==========================================
        function renderizarApp() {
            const container = document.getElementById('app');
            const urlParams = new URLSearchParams(window.location.search);
            const modoPublico = urlParams.get('view') === 'agendar';
            const db = lerDB();

            if (modoPublico) {
                container.innerHTML = obterLayoutCliente();
                return;
            }

            if (!db.config.autenticado) {
                container.innerHTML = obterLayoutLogin();
                return;
            }

            container.innerHTML = `
                <div class="flex flex-col md:flex-row min-h-screen">
                    <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col justify-between z-10">
                        <div>
                            <div class="p-6 border-b border-slate-100 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center text-white shadow-md">
                                    <i class="fa-solid fa-sparkles"></i>
                                </div>
                                <div>
                                    <h1 class="font-bold text-base text-slate-800 leading-tight">Estética Click</h1>
                                    <span class="text-[10px] font-bold text-amber-600 tracking-wider uppercase">Painel de Gestão</span>
                                </div>
                            </div>
                            <nav class="mt-6 px-3 space-y-1">
                                <button onclick="navegar('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'dashboard' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                                </button>
                                <button onclick="navegar('estoque')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'estoque' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-boxes-stacked w-5"></i> Estoque
                                </button>
                                <button onclick="navegar('agendamentos')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'agendamentos' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-calendar-days w-5"></i> Agendamentos
                                </button>
                                <button onclick="navegar('marketing')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'marketing' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-comments-dollar w-5"></i> Retenção de Clientes
                                </button>
                                <button onclick="navegar('config')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'config' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-sliders w-5"></i> Configurações & Backup
                                </button>
                            </nav>
                        </div>
                        <div class="p-4 border-t border-slate-100">
                            <button onclick="executarLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-rose-600 hover:bg-rose-50 text-sm font-semibold transition text-left">
                                <i class="fa-solid fa-right-from-bracket"></i> Desconectar
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 p-6 md:p-8 overflow-y-auto">
                        ${obterConteudoAdmin(db)}
                    </main>
                </div>
            `;

            if (telaAtiva === "dashboard") {
                inicializarGrafico(db);
            }
        }

        // ==========================================
        // 5. LAYOUTS HTML DE SUPORTE
        // ==========================================
        function obterLayoutLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4" style="background-image: radial-gradient(circle at top right, rgba(212,175,55,0.12), transparent 45%);">
                    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-100">
                        <div class="text-center mb-6">
                            <div class="w-14 h-14 rounded-2xl gold-gradient flex items-center justify-center text-white mx-auto shadow-md mb-3">
                                <i class="fa-solid fa-shield-halved text-xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-800">Acesso Restrito</h2>
                            <p class="text-xs text-slate-400 mt-1">Chave de licença ativa obrigatória</p>
                        </div>
                        <form onsubmit="executarLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Usuário</label>
                                <input type="text" id="l_user" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Senha</label>
                                <input type="password" id="l_pass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Chave de Ativação SaaS</label>
                                <input type="text" id="l_key" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none font-mono text-sm tracking-widest text-amber-700">
                            </div>
                            <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-white gold-gradient shadow-lg hover:opacity-95 transition mt-2 cursor-pointer">
                                Verificar Assinatura
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function obterLayoutCliente() {
            return `
                <div class="min-h-screen flex flex-col items-center justify-center p-4" style="background: linear-gradient(135deg, #FFF5F5 0%, #FFF0F5 100%);">
                    <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-6 md:p-8 border border-pink-100/60">
                        <div class="text-center mb-6">
                            <span class="px-3 py-1 bg-pink-50 text-pink-600 rounded-full text-[10px] font-bold uppercase tracking-wider">Agendamento Online</span>
                            <h2 class="text-2xl font-black text-slate-800 mt-2">Estética Click</h2>
                            <p class="text-slate-400 text-xs mt-1">Selecione seu procedimento exclusivo e reserve seu horário.</p>
                        </div>
                        <form onsubmit="gravarAgendamentoCliente(event)" class="space-y-5">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Nome Completo</label>
                                    <input type="text" id="c_nome" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-300 focus:outline-none transition text-sm">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">WhatsApp (com DDD)</label>
                                    <input type="tel" id="c_whats" required placeholder="Ex: 5511999999999" class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-300 focus:outline-none transition text-sm">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Data</label>
                                    <input type="date" id="c_data" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-300 focus:outline-none transition text-sm">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Horário</label>
                                    <input type="time" id="c_hora" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-300 focus:outline-none transition text-sm">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-400 mb-1">Procedimento</label>
                                    <select id="c_proc" required class="w-full px-3 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-300 focus:outline-none transition text-sm">
                                        <option value="Botox">Toxina Botulínica (Botox) - R$ 1.200</option>
                                        <option value="Preenchimento">Preenchimento Labial - R$ 1.500</option>
                                        <option value="Limpeza de Pele">Limpeza de Pele - R$ 180</option>
                                        <option value="Massagem">Drenagem Linfática - R$ 120</option>
                                    </select>
                                </div>
                            </div>

                            <div class="bg-amber-50/60 border-2 border-dashed border-amber-300 rounded-2xl p-4 flex items-start gap-3 relative overflow-hidden shadow-sm">
                                <div class="absolute top-0 right-0 bg-amber-500 text-white font-bold text-[8px] uppercase px-2.5 py-0.5 rounded-bl-lg tracking-wider">Oferta Única</div>
                                <div class="mt-0.5">
                                    <input type="checkbox" id="c_bump" class="w-4 h-4 accent-amber-600 rounded cursor-pointer">
                                </div>
                                <div>
                                    <label for="c_bump" class="font-bold text-amber-900 block text-sm cursor-pointer">Adicionar Protetor Solar Facial Premium com 20% OFF?</label>
                                    <p class="text-[11px] text-amber-700 mt-0.5">Retire no balcão no dia do atendimento. De <span class="line-through">R$ 62,00</span> por <strong>apenas R$ 49,90!</strong></p>
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-white bg-gradient-to-r from-pink-500 to-rose-600 shadow-lg shadow-pink-200 hover:opacity-95 transition text-center text-base cursor-pointer">
                                Confirmar Agendamento Premium
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function obterConteudoAdmin(db) {
            let totalEntradas = 0;
            let totalSaidas = 0;
            db.financeiro.forEach(m => {
                if (m.tipo === 'entrada') totalEntradas += m.valor;
                else totalSaidas += m.valor;
            });
            let saldoLiquido = totalEntradas - totalSaidas;

            if (telaAtiva === "dashboard") {
                let linhasMov = db.financeiro.slice(-4).reverse().map(m => `
                    <tr class="border-b border-slate-100 text-sm hover:bg-slate-50 transition">
                        <td class="px-4 py-3 font-medium text-slate-800">${m.descricao}</td>
                        <td class="px-4 py-3 text-slate-400 text-xs">${m.data}</td>
                        <td class="px-4 py-3 font-bold ${m.tipo === 'entrada' ? 'text-emerald-600' : 'text-rose-500'}">
                            ${m.tipo === 'entrada' ? '+' : '-'} ${m.valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}
                        </td>
                    </tr>
                `).join('');

                let alertasEstoque = db.estoque.filter(i => i.qtd <= 3).map(i => `
                    <div class="flex items-center justify-between p-3 bg-rose-50 border border-rose-100 rounded-xl text-xs text-rose-800 font-medium">
                        <span class="flex items-center gap-2"><i class="fa-solid fa-triangle-exclamation text-rose-500"></i> ${i.nome} crítico!</span>
                        <span class="bg-rose-200 px-2 py-0.5 rounded text-rose-900 font-bold">${i.qtd} un restante</span>
                    </div>
                `).join('');

                if (!alertasEstoque) {
                    alertasEstoque = `<p class="text-xs text-slate-400 italic">Todos os produtos estão com níveis saudáveis de estoque.</p>`;
                }

                const linkCompletoCliente = window.location.href.split('?')[0] + "?view=agendar";

                return `
                    <div class="mb-6 flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4">
                        <div>
                            <h2 class="text-2xl font-black text-slate-800">Painel Geral</h2>
                            <p class="text-slate-400 text-xs mt-0.5">Visão do negócio integrada ao ecossistema.</p>
                        </div>
                        <a href="${linkCompletoCliente}" target="_blank" class="px-4 py-2.5 text-xs font-bold text-white bg-amber-600 hover:bg-amber-700 rounded-xl shadow-md flex items-center gap-2 transition">
                            <i class="fa-solid fa-arrow-up-right-from-square"></i> Link de Agendamento (Instagram Bio)
                        </a>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-5 mb-8">
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Faturamento Bruto</span>
                            <span class="text-xl font-black text-emerald-600 block mt-1">${totalEntradas.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Despesas operacionais</span>
                            <span class="text-xl font-black text-rose-500 block mt-1">${totalSaidas.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                        </div>
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 block">Saldo Líquido</span>
                            <span class="text-xl font-black text-slate-800 block mt-1">${saldoLiquido.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</span>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 class="font-bold text-sm text-slate-700 mb-4 flex items-center gap-2"><i class="fa-solid fa-receipt text-amber-500"></i> Últimas Movimentações Financeiras</h3>
                                <div class="overflow-x-auto">
                                    <table class="w-full text-left border-collapse">
                                        <thead>
                                            <tr class="text-[10px] uppercase font-bold tracking-wider text-slate-400 border-b border-slate-100">
                                                <th class="pb-3 px-4">Descrição</th>
                                                <th class="pb-3 px-4">Data</th>
                                                <th class="pb-3 px-4">Valor</th>
                                            </tr>
                                        </thead>
                                        <tbody>${linhasMov}</tbody>
                                    </table>
                                </div>
                            </div>

                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                                <h3 class="font-bold text-sm text-slate-700 mb-3"><i class="fa-solid fa-cash-register text-slate-400"></i> Lançamento de Caixa Manual</h3>
                                <form onsubmit="adicionarMovimentoManual(event)" class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                                    <input type="text" id="f_desc" placeholder="Ex: Conta de luz" required class="sm:col-span-2 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <select id="f_tipo" class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                        <option value="entrada">Entrada (+)</option>
                                        <option value="saida">Saída (-)</option>
                                    </select>
                                    <input type="number" step="0.01" id="f_valor" placeholder="Valor (R$)" required class="px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <input type="date" id="f_data" required class="sm:col-span-2 px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    <button type="submit" class="sm:col-span-2 py-2 gold-gradient text-white rounded-xl text-xs font-bold shadow hover:opacity-90">Lançar Fluxo</button>
                                </form>
                            </div>
                        </div>

                        <div class="space-y-6">
                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col items-center">
                                <h3 class="font-bold text-sm text-slate-700 mb-4 self-start"><i class="fa-solid fa-chart-pie text-slate-400"></i> Divisão de Caixa</h3>
                                <div class="w-full h-44 relative">
                                    <canvas id="graficoFinanceiro"></canvas>
                                </div>
                            </div>

                            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 space-y-3">
                                <h3 class="font-bold text-sm text-slate-700 flex items-center gap-2"><i class="fa-solid fa-bell text-rose-500"></i> Alertas Críticos (Estoque)</h3>
                                ${alertasEstoque}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (telaAtiva === "estoque") {
                let rows = db.estoque.map(i => `
                    <tr class="border-b border-slate-100 text-sm hover:bg-slate-50 transition">
                        <td class="px-4 py-3 font-semibold text-slate-800">${i.nome}</td>
                        <td class="px-4 py-3 text-center">
                            <div class="flex items-center justify-center gap-2">
                                <button onclick="alterarEstoque(${i.id}, -1)" class="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-600">-</button>
                                <span class="font-bold ${i.qtd <= 3 ? 'text-rose-600' : 'text-slate-800'}">${i.qtd}</span>
                                <button onclick="alterarEstoque(${i.id}, 1)" class="w-6 h-6 rounded bg-slate-100 hover:bg-slate-200 text-xs font-bold text-slate-600">+</button>
                            </div>
                        </td>
                        <td class="px-4 py-3">${i.custo.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                        <td class="px-4 py-3 font-bold">${i.venda.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' })}</td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="excluirProduto(${i.id})" class="text-rose-500 hover:text-rose-700 text-xs font-bold px-2 py-1 bg-rose-50 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');

                return `
                    <div class="mb-6">
                        <h2 class="text-2xl font-black text-slate-800">Controle de Estoque Automatizado</h2>
                        <p class="text-slate-400 text-xs mt-0.5">Gerencie os insumos da sua bancada e balcão.</p>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <div class="overflow-x-auto">
                                <table class="w-full text-left border-collapse">
                                    <thead>
                                        <tr class="text-[10px] uppercase font-bold tracking-wider text-slate-400 border-b border-slate-100">
                                            <th class="pb-3 px-4">Item / Produto</th>
                                            <th class="pb-3 px-4 text-center">Quantidade</th>
                                            <th class="pb-3 px-4">Custo Unitário</th>
                                            <th class="pb-3 px-4">Preço de Venda</th>
                                            <th class="pb-3 px-4 text-right">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody>${rows}</tbody>
                                </table>
                            </div>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 h-fit">
                            <h3 class="font-bold text-sm text-slate-700 mb-4"><i class="fa-solid fa-plus text-amber-500"></i> Cadastrar Novo Insumo</h3>
                            <form onsubmit="adicionarProduto(event)" class="space-y-3">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Nome do Produto</label>
                                    <input type="text" id="p_nome" placeholder="Ex: Pomada Efeito Matte 150g" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Quantidade</label>
                                        <input type="number" id="p_qtd" placeholder="10" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    </div>
                                    <div>
                                        <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Custo (R$)</label>
                                        <input type="number" step="0.01" id="p_custo" placeholder="25.00" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Preço de Venda (R$)</label>
                                    <input type="number" step="0.01" id="p_venda" placeholder="50.00" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                </div>
                                <button type="submit" class="w-full py-2.5 rounded-xl font-bold text-white gold-gradient shadow hover:opacity-90 transition text-xs">Adicionar ao Catálogo</button>
                            </form>
                        </div>
                    </div>
                `;
            }

            if (telaAtiva === "agendamentos") {
                let rows = db.agendamentos.map(a => `
                    <tr class="border-b border-slate-100 text-sm hover:bg-slate-50 transition">
                        <td class="px-4 py-3 font-semibold text-slate-800">${a.cliente}</td>
                        <td class="px-4 py-3 font-medium text-slate-600">${a.procedimento}</td>
                        <td class="px-4 py-3 text-xs text-slate-500">${a.data} às ${a.horario}</td>
                        <td class="px-4 py-3 text-center">
                            ${a.bump ? '<span class="bg-amber-100 text-amber-800 font-bold text-[10px] px-2 py-0.5 rounded-full"><i class="fa-solid fa-fire"></i> Sim (+ R$49,90)</span>' : '<span class="text-slate-300 text-xs">Não</span>'}
                        </td>
                        <td class="px-4 py-3 text-right space-x-1">
                            <button onclick="concluirAgendamento(${a.id})" class="bg-emerald-50 text-emerald-700 hover:bg-emerald-100 font-bold text-xs px-3 py-1.5 rounded-xl transition"><i class="fa-solid fa-check"></i> Finalizar Caixa</button>
                            <button onclick="excluirAgendamento(${a.id})" class="text-rose-500 hover:text-rose-700 text-xs font-bold p-1.5 rounded-xl"><i class="fa-solid fa-xmark"></i></button>
                        </td>
                    </tr>
                `).join('');

                if (!rows) {
                    rows = `<tr><td colspan="5" class="text-center py-6 text-slate-400 italic text-xs">Nenhum agendamento ativo na fila.</td></tr>`;
                }

                return `
                    <div class="mb-6">
                        <h2 class="text-2xl font-black text-slate-800">Fila de Agendamentos Ativos</h2>
                        <p class="text-slate-400 text-xs mt-0.5">Clique em "Finalizar Caixa" para registrar a entrada e deduzir automaticamente o estoque.</p>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="text-[10px] uppercase font-bold tracking-wider text-slate-400 border-b border-slate-100">
                                        <th class="pb-3 px-4">Cliente</th>
                                        <th class="pb-3 px-4">Procedimento</th>
                                        <th class="pb-3 px-4">Data/Horário</th>
                                        <th class="pb-3 px-4 text-center">Order Bump (Protetor)</th>
                                        <th class="pb-3 px-4 text-right">Ações de Fechamento</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            if (telaAtiva === "marketing") {
                let rows = db.clientesInativos.map(c => `
                    <tr class="border-b border-slate-100 text-sm hover:bg-slate-50 transition">
                        <td class="px-4 py-3 font-semibold text-slate-800">${c.nome}</td>
                        <td class="px-4 py-3 text-slate-500">${c.ultimoProcedimento}</td>
                        <td class="px-4 py-3 text-center"><span class="bg-rose-50 text-rose-700 font-bold text-xs px-2 py-0.5 rounded-full">${c.dias} dias ausente</span></td>
                        <td class="px-4 py-3 text-right">
                            <button onclick="dispararWhatsApp('${c.nome}', '${c.whatsapp}', '${c.ultimoProcedimento}', ${c.dias})" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs px-3 py-1.5 rounded-xl shadow transition inline-flex items-center gap-1">
                                <i class="fa-brands fa-whatsapp text-sm"></i> Disparar Lembrete
                            </button>
                        </td>
                    </tr>
                `).join('');

                return `
                    <div class="mb-6">
                        <h2 class="text-2xl font-black text-slate-800">Motor de Retenção de Clientes</h2>
                        <p class="text-slate-400 text-xs mt-0.5">O sistema mapeia os clientes que ultrapassaram a janela de retorno ideal.</p>
                    </div>

                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                        <div class="overflow-x-auto">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="text-[10px] uppercase font-bold tracking-wider text-slate-400 border-b border-slate-100">
                                        <th class="pb-3 px-4">Cliente</th>
                                        <th class="pb-3 px-4">Último Serviço realizado</th>
                                        <th class="pb-3 px-4 text-center">Janela de Inatividade</th>
                                        <th class="pb-3 px-4 text-right">Ação Reativa (WhatsApp)</th>
                                    </tr>
                                </thead>
                                <tbody>${rows}</tbody>
                            </table>
                        </div>
                    </div>
                `;
            }

            if (telaAtiva === "config") {
                return `
                    <div class="mb-6">
                        <h2 class="text-2xl font-black text-slate-800">Configurações Gerais & Licença SaaS</h2>
                        <p class="text-slate-400 text-xs mt-0.5">Gerenciamento de segurança, chaves corporativas e salvamento de dados.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                            <h3 class="font-bold text-sm text-slate-700 mb-4"><i class="fa-solid fa-lock text-slate-400"></i> Credenciais do Administrador</h3>
                            <form onsubmit="autenticarConfiguracoes(event)" class="space-y-3">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Usuário</label>
                                    <input type="text" id="cfg_user" value="${db.config.usuario}" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Senha</label>
                                    <input type="password" id="cfg_pass" value="${db.config.senha}" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-amber-500">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Chave de Ativação SaaS Ativa</label>
                                    <input type="text" id="cfg_key" value="${db.config.chave}" required class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-xl text-xs font-mono tracking-widest text-amber-700 focus:outline-none focus:ring-2 focus:ring-amber-500">
                                </div>
                                <button type="submit" onclick="atualizarConfiguracoes(event)" class="w-full py-2.5 rounded-xl font-bold text-white gold-gradient shadow hover:opacity-90 transition text-xs">Salvar Configurações</button>
                            </form>
                        </div>

                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-sm text-slate-700 mb-2"><i class="fa-solid fa-database text-amber-500"></i> Banco de Dados Local (Backup)</h3>
                                <p class="text-xs text-slate-400 leading-relaxed mb-4">Como este sistema opera localmente para máxima performance de carregamento, recomendamos baixar um arquivo de segurança periodicamente para não perder seus registros financeiros.</p>
                            </div>
                            <div class="space-y-2">
                                <button onclick="realizarBackup()" class="w-full py-2.5 bg-slate-800 hover:bg-slate-900 text-white rounded-xl font-bold text-xs flex items-center justify-center gap-2 shadow transition">
                                    <i class="fa-solid fa-download"></i> Exportar Banco de Dados em JSON
                                </button>
                                <button onclick="localStorage.clear(); location.reload();" class="w-full py-2.5 bg-rose-50 text-rose-700 hover:bg-rose-100 rounded-xl font-bold text-xs flex items-center justify-center gap-2 transition">
                                    <i class="fa-solid fa-trash-can"></i> Limpar Tudo (Reset de Fábrica)
                                </button>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // ==========================================
        // 6. INICIALIZADOR DO GRÁFICO (CHART.JS)
        // ==========================================
        function inicializarGrafico(db) {
            const ctx = document.getElementById('graficoFinanceiro');
            if (!ctx) return;

            if (graficoInstancia) {
                graficoInstancia.destroy();
            }

            let totalEntradas = 0;
            let totalSaidas = 0;
            db.financeiro.forEach(m => {
                if (m.tipo === 'entrada') totalEntradas += m.valor;
                else totalSaidas += m.valor;
            });

            graficoInstancia = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Faturamento', 'Despesas'],
                    datasets: [{
                        data: [totalEntradas, totalSaidas],
                        backgroundColor: ['#D4AF37', '#F43F5E'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { boxWidth: 12, font: { size: 10, family: 'sans-serif' } }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        renderizarApp();
    </script>
</body>
</html>
