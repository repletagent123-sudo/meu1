<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética Click - Sistema de Gestão Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%); }
        .sidebar-active { background-color: #FFF0F5; color: #AA7C11; font-weight: bold; border-left: 4px solid #D4AF37; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>
    <div id="app" class="min-h-screen flex flex-col justify-between"></div>

    <script>
        // ==========================================
        // 1. ESTRUTURA DO BANCO DE DADOS LOCAL
        // ==========================================
        const DADOS_MOCK = {
            config: { usuario: "admin", senha: "123", chave: "ESTETICA2026", autenticado: true },
            financeiro: [
                { id: 1, descricao: "Procedimento Botox - Ana Silva", tipo: "entrada", valor: 1200.00, data: "2026-06-05" },
                { id: 2, descricao: "Preenchimento Labial (+ Protetor Bump)", tipo: "entrada", valor: 1549.90, data: "2026-06-06" },
                { id: 3, descricao: "Compra de Luvas e Microagulhas", tipo: "saida", valor: 150.00, data: "2026-06-07" },
                { id: 4, descricao: "Limpeza de Pele - Maria Souza", tipo: "entrada", valor: 180.00, data: "2026-06-08" }
            ],
            estoque: [
                { id: 1, nome: "Toxina Botulínica (Botox)", qtd: 5, custo: 450.00, venda: 1200.00 },
                { id: 2, nome: "Ácido Hialurônico 1ml", qtd: 2, custo: 300.00, venda: 1500.00 },
                { id: 3, nome: "Protetor Solar Facial Premium", qtd: 14, custo: 25.00, venda: 49.90 },
                { id: 4, nome: "Creme Hidratante Calmante", qtd: 1, custo: 40.00, venda: 90.00 }
            ],
            agendamentos: [
                { id: 1, cliente: "Ana Silva", whatsapp: "5511999999999", procedimento: "Botox", data: "2026-06-09", horario: "14:00", bump: false },
                { id: 2, cliente: "Maria Souza", whatsapp: "5511988888888", procedimento: "Limpeza de Pele", data: "2026-06-09", horario: "16:00", bump: true }
            ],
            clientesInativos: [
                { id: 1, nome: "Juliana Ribeiro", whatsapp: "5511977777777", ultimoProcedimento: "Preenchimento", dias: 45 },
                { id: 2, nome: "Carla Mendes", whatsapp: "5511966666666", ultimoProcedimento: "Limpeza de Pele", dias: 32 }
            ]
        };

        const PRECOS_PROCEDIMENTOS = {
            "Botox": 1200.00,
            "Preenchimento": 1500.00,
            "Limpeza de Pele": 180.00,
            "Massagem": 120.00
        };

        function lerDB() {
            if (!localStorage.getItem('estetica_click_db')) {
                localStorage.setItem('estetica_click_db', JSON.stringify(DADOS_MOCK));
            }
            return JSON.parse(localStorage.getItem('estetica_click_db'));
        }

        function gravarDB(dados) {
            localStorage.setItem('estetica_click_db', JSON.stringify(dados));
        }

        let telaAtiva = "dashboard";
        let graficoInstancia = null;

        function navegar(tela) {
            telaAtiva = tela;
            renderizarApp();
        }

        function mostrarToast(mensagem, tipo = "sucesso") {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-xl border text-sm font-semibold flex items-center gap-3 transition-all duration-300 transform translate-y-2 pointer-events-auto min-w-[280px] ${
                tipo === "sucesso" ? "bg-emerald-50 border-emerald-200 text-emerald-800" : "bg-rose-50 border-rose-200 text-rose-800"
            }`;
            const icone = tipo === "sucesso" ? "fa-circle-check" : "fa-circle-exclamation";
            toast.innerHTML = `<i class="fa-solid ${icone} text-lg"></i> <span>${mensagem}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3500);
        }

        // ==========================================
        // 2. AUTENTICAÇÃO E AGENDAMENTO PÚBLICO
        // ==========================================
        function executarLogin(event) {
            event.preventDefault();
            const u = document.getElementById('l_user').value;
            const s = document.getElementById('l_pass').value;
            const k = document.getElementById('l_key').value;
            const db = lerDB();

            if (u === db.config.usuario && s === db.config.senha && k === db.config.chave) {
                db.config.autenticado = true;
                gravarDB(db);
                mostrarToast("Licença SaaS validada com sucesso!");
                renderizarApp();
            } else {
                mostrarToast("Usuário, senha ou chave inválidos!", "erro");
            }
        }

        function executarLogout() {
            const db = lerDB();
            db.config.autenticado = false;
            gravarDB(db);
            renderizarApp();
        }

        function gravarAgendamentoCliente(event) {
            event.preventDefault();
            const db = lerDB();
            
            const novoAgendamento = {
                id: Date.now(),
                cliente: document.getElementById('c_nome').value,
                whatsapp: document.getElementById('c_whats').value.replace(/\D/g, ''),
                procedimento: document.getElementById('c_proc').value,
                data: document.getElementById('c_data').value,
                horario: document.getElementById('c_hora').value,
                bump: document.getElementById('c_bump').checked
            };

            db.agendamentos.push(novoAgendamento);
            gravarDB(db);
            
            mostrarToast("Agendamento Premium Reservado com sucesso!");
            event.target.reset();
        }

        // ==========================================
        // 3. OPERAÇÕES DO BACKOFFICE ADMINISTRATIVO
        // ==========================================
        function adicionarProduto(event) {
            event.preventDefault();
            const db = lerDB();
            const novoItem = {
                id: Date.now(),
                nome: document.getElementById('p_nome').value,
                qtd: parseInt(document.getElementById('p_qtd').value),
                custo: parseFloat(document.getElementById('p_custo').value),
                venda: parseFloat(document.getElementById('p_venda').value)
            };
            db.estoque.push(novoItem);
            gravarDB(db);
            mostrarToast("Produto adicionado ao estoque!");
            renderizarApp();
        }

        function alterarEstoque(id, delta) {
            const db = lerDB();
            const item = db.estoque.find(i => i.id === id);
            if (item) {
                item.qtd = Math.max(0, item.qtd + delta);
                gravarDB(db);
                renderizarApp();
            }
        }

        function excluirProduto(id) {
            const db = lerDB();
            db.estoque = db.estoque.filter(i => i.id !== id);
            gravarDB(db);
            mostrarToast("Produto removido do estoque.");
            renderizarApp();
        }

        function concluirAgendamento(id) {
            const db = lerDB();
            const idx = db.agendamentos.findIndex(a => a.id === id);
            if (idx === -1) return;
            
            const agendamento = db.agendamentos[idx];
            const valorBase = PRECOS_PROCEDIMENTOS[agendamento.procedimento] || 100.00;
            
            db.financeiro.push({
                id: Date.now(),
                descricao: `Procedimento ${agendamento.procedimento} - ${agendamento.cliente}`,
                tipo: "entrada",
                valor: valorBase,
                data: new Date().toISOString().split('T')[0]
            });

            if (agendamento.bump) {
                db.financeiro.push({
                    id: Date.now() + 1,
                    descricao: `Venda Order Bump - Protetor Solar (${agendamento.cliente})`,
                    tipo: "entrada",
                    valor: 49.90,
                    data: new Date().toISOString().split('T')[0]
                });

                const protetor = db.estoque.find(i => i.id === 3 || i.nome.includes("Protetor"));
                if (protetor && protetor.qtd > 0) {
                    protetor.qtd -= 1;
                }
            }

            db.clientesInativos.push({
                id: Date.now(),
                nome: agendamento.cliente,
                whatsapp: agendamento.whatsapp,
                ultimoProcedimento: agendamento.procedimento,
                dias: 1
            });

            db.agendamentos.splice(idx, 1);
            gravarDB(db);
            mostrarToast("Atendimento finalizado e computado no caixa!");
            renderizarApp();
        }

        function excluirAgendamento(id) {
            const db = lerDB();
            db.agendamentos = db.agendamentos.filter(a => a.id !== id);
            gravarDB(db);
            mostrarToast("Agendamento removido.");
            renderizarApp();
        }

        function dispararWhatsApp(nome, whats, procedimento, dias) {
            const texto = `Olá ${nome}! Tudo bem? Notamos aqui no sistema que faz ${dias} dias desde o seu último procedimento de ${procedimento}. O visual deve estar precisando de uma renovação! Garanta seu horário exclusivo clicando no nosso link de agendamento online: ${window.location.href.split('?')[0]}?view=agendar`;
            const url = `https://api.whatsapp.com/send?phone=${whats}&text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        function adicionarMovimentoManual(event) {
            event.preventDefault();
            const db = lerDB();
            db.financeiro.push({
                id: Date.now(),
                descricao: document.getElementById('f_desc').value,
                tipo: document.getElementById('f_tipo').value,
                valor: parseFloat(document.getElementById('f_valor').value),
                data: document.getElementById('f_data').value
            });
            gravarDB(db);
            mostrarToast("Movimentação de caixa lançada!");
            renderizarApp();
        }

        function atualizarConfiguracoes(event) {
            event.preventDefault();
            const db = lerDB();
            db.config.usuario = document.getElementById('cfg_user').value;
            db.config.senha = document.getElementById('cfg_pass').value;
            db.config.chave = document.getElementById('cfg_key').value;
            gravarDB(db);
            mostrarToast("Configurações updated com sucesso!");
            renderizarApp();
        }

        function realizarBackup() {
            const db = lerDB();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `backup_estetica_click.json`);
            dlAnchorElem.click();
        }

        // ==========================================
        // 4. RENDERIZADOR DO CORE DA APLICAÇÃO
        // ==========================================
        function renderizarApp() {
            const container = document.getElementById('app');
            const urlParams = new URLSearchParams(window.location.search);
            const modoPublico = urlParams.get('view') === 'agendar';
            const db = lerDB();

            if (modoPublico) {
                container.innerHTML = obterLayoutCliente();
                return;
            }

            // TRAVA DE LOGIN FILTRADA - PAINEL ADM DIRETO
            container.innerHTML = `
                <div class="flex flex-col md:flex-row min-h-screen">
                    <aside class="w-full md:w-64 bg-white border-r border-slate-200 flex flex-col justify-between z-10">
                        <div>
                            <div class="p-6 border-b border-slate-100 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center text-white shadow-md">
                                    <i class="fa-solid fa-sparkles"></i>
                                </div>
                                <div>
                                    <h1 class="font-bold text-base text-slate-800 leading-tight">Estética Click</h1>
                                    <span class="text-[10px] font-bold text-amber-600 tracking-wider uppercase">Painel de Gestão</span>
                                </div>
                            </div>
                            <nav class="mt-6 px-3 space-y-1">
                                <button onclick="navegar('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'dashboard' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                                </button>
                                <button onclick="navegar('estoque')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'estoque' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-boxes-stacked w-5"></i> Estoque
                                </button>
                                <button onclick="navegar('agendamentos')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'agendamentos' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-calendar-days w-5"></i> Agendamentos
                                </button>
                                <button onclick="navegar('marketing')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'marketing' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-comments-dollar w-5"></i> Retenção de Clientes
                                </button>
                                <button onclick="navegar('config')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-600 text-sm text-left transition ${telaAtiva === 'config' ? 'sidebar-active' : 'hover:bg-slate-50'}">
                                    <i class="fa-solid fa-sliders w-5"></i> Configurações & Backup
                                </button>
                            </nav>
                        </div>
                        <div class="p-4 border-t border-slate-100">
                            <button onclick="executarLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-rose-600 hover:bg-rose-50 text-sm font-semibold transition text-left">
                                <i class="fa-solid fa-right-from-bracket"></i> Sair do Painel
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 p-6 md:p-8 overflow-y-auto">
                        ${obterConteudoAdmin(db)}
                    </main>
                </div>
            `;

            if (telaAtiva === "dashboard") {
                inicializarGrafico(db);
            }
        }

        // ==========================================
        // 5. LAYOUTS HTML DE SUPORTE
        // ==========================================
        function obterLayoutLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-slate-900 p-4" style="background-image: radial-gradient(circle at top right, rgba(212,175,55,0.12), transparent 45%);">
                    <div class="bg-white p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-100">
                        <div class="text-center mb-6">
                            <div class="w-14 h-14 rounded-2xl gold-gradient flex items-center justify-center text-white mx-auto shadow-md mb-3">
                                <i class="fa-solid fa-shield-halved text-xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-800">Acesso Restrito</h2>
                            <p class="text-xs text-slate-400 mt-1">Chave de licença ativa obrigatória</p>
                        </div>
                        <form onsubmit="executarLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Usuário</label>
                                <input type="text" id="l_user" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Senha</label>
                                <input type="password" id="l_pass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-400 mb-1">Chave de Ativação SaaS</label>
                                <input type="text" id="l_key" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none font-mono text-sm tracking-widest text-amber-700">
                            </div>
                            <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-white gold-gradient shadow-lg hover:opacity-95 transition mt-2 cursor-pointer">
                                Verificar Assinatura
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function obterLayoutCliente() {
            return `
                <div class="min-h-screen flex flex-col items-center justify-center p-4" style="background: linear-gradient(135deg, #FFF5F5 0%, #FFF0F5 100%);">
                    <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg p-6 md:p-8 border border-pink-100/60">
                        <div class="text-center mb-6">
                            <span class="px-3 py-1 bg-pink-50 text-pink-600 rounded-full text-[10px] font-bold uppercase tracking-wider">Agendamento Online</span>
                            <h2 class="text-2xl font-bold text-slate-800 mt-2">Agende seu Horário Premium</h2>
                            <p class="text-sm text-slate-500">Escolha o procedimento e reserve seu momento de autocuidado.</p>
                        </div>
                        <form onsubmit="gravarAgendamentoCliente(event)" class="space-y-4">
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Seu Nome Completo</label>
                                <input type="text" id="c_nome" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 focus:outline-none text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">WhatsApp (com DDD)</label>
                                <input type="text" id="c_whats" placeholder="11999999999" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 focus:outline-none text-sm">
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Data</label>
                                    <input type="date" id="c_data" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 focus:outline-none text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-600 mb-1">Horário</label>
                                    <input type="time" id="c_hora" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 focus:outline-none text-sm">
                                </div>
                            </div>
                            <div>
                                <label class="block text-xs font-semibold text-slate-600 mb-1">Procedimento</label>
                                <select id="c_proc" class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-pink-500 focus:outline-none text-sm">
                                    <option value="Botox">Toxina Botulínica (Botox) - R$ 1.200,00</option>
                                    <option value="Preenchimento">Ácido Hialurônico (Preenchimento) - R$ 1.500,00</option>
                                    <option value="Limpeza de Pele">Limpeza de Pele Premium - R$ 180,00</option>
                                </select>
                            </div>
                            <div class="p-4 bg-pink-50/50 rounded-2xl border border-pink-100 flex items-start gap-3">
                                <input type="checkbox" id="c_bump" class="mt-1 rounded text-pink-600 focus:ring-pink-500">
                                <div>
                                    <label for="c_bump" class="block text-xs font-bold text-slate-800 cursor-pointer">Adicionar Protetor Solar Facial Premium por apenas R$ 49,90?</label>
                                    <p class="text-[11px] text-slate-500">Leve hoje mesmo com desconto exclusivo direto no seu atendimento!</p>
                                </div>
                            </div>
                            <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-pink-500 to-rose-500 text-white rounded-xl font-bold shadow-lg hover:opacity-95 transition cursor-pointer text-center text-sm">
                                Confirmar Agendamento
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function obterConteudoAdmin(db) {
            let totalEntradas = 0;
            let totalSaidas = 0;
            db.financeiro.forEach(m => {
                if (m.tipo === 'entrada') totalEntradas += m.valor;
                else totalSaidas += m.valor;
            });
            let saldo = totalEntradas - totalSaidas;

            if (telaAtiva === "dashboard") {
                return `
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-slate-800">Visão Geral do Negócio</h2>
                        <p class="text-sm text-slate-500">Acompanhe as finanças e métricas em tempo real.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-xs font-bold text-slate-400 uppercase">Faturamento</span>
                                <i class="fa-solid fa-arrow-trend-up text-emerald-500 text-lg"></i>
                            </div>
                            <h3 class="text-2xl font-black text-slate-800">R$ ${totalEntradas.toFixed(2)}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-xs font-bold text-slate-400 uppercase">Despesas</span>
                                <i class="fa-solid fa-arrow-trend-down text-rose-500 text-lg"></i>
                            </div>
                            <h3 class="text-2xl font-black text-slate-800">R$ ${totalSaidas.toFixed(2)}</h3>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <div class="flex justify-between items-center mb-4">
                                <span class="text-xs font-bold text-slate-400 uppercase">Saldo Líquido</span>
                                <i class="fa-solid fa-wallet text-amber-500 text-lg"></i>
                            </div>
                            <h3 class="text-2xl font-black ${saldo >= 0 ? 'text-emerald-600' : 'text-rose-600'}">R$ ${saldo.toFixed(2)}</h3>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col items-center">
                            <h4 class="text-sm font-bold text-slate-700 mb-4 self-start">Gráfico Financeiro</h4>
                            <div class="w-full max-w-[280px] h-[280px]">
                                <canvas id="financeiroChart"></canvas>
                            </div>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h4 class="text-sm font-bold text-slate-700 mb-4">Lançar Movimentação Manual</h4>
                            <form onsubmit="adicionarMovimentoManual(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Descrição</label>
                                    <input type="text" id="f_desc" required class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm">
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 mb-1">Tipo</label>
                                        <select id="f_tipo" class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm">
                                            <option value="entrada">Entrada (Faturamento)</option>
                                            <option value="saida">Saída (Despesa)</option>
                                        </select>
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 mb-1">Valor (R$)</label>
                                        <input type="number" step="0.01" id="f_valor" required class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm">
                                    </div>
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Data</label>
                                    <input type="date" id="f_data" value="${new Date().toISOString().split('T')[0]}" required class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm">
                                </div>
                                <button type="submit" class="w-full py-2.5 text-white bg-slate-800 rounded-xl font-bold hover:bg-slate-700 transition text-sm">Lançar no Caixa</button>
                            </form>
                        </div>
                    </div>
                `;
            }

            if (telaAtiva === "estoque") {
                return `
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-slate-800">Controle de Estoque</h2>
                        <p class="text-sm text-slate-500">Gerencie insumos e produtos para venda.</p>
                    </div>
                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2 bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                            <table class="w-full text-left border-collapse">
                                <thead>
                                    <tr class="bg-slate-50 border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                                        <th class="p-4">Item</th>
                                        <th class="p-4">Qtd</th>
                                        <th class="p-4">Custo / Venda</th>
                                        <th class="p-4 text-right">Ações</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-slate-100 text-sm">
                                    ${db.estoque.map(i => `
                                        <tr>
                                            <td class="p-4 font-semibold text-slate-700">${i.nome} ${i.qtd <= 2 ? '<span class="ml-2 px-2 py-0.5 bg-rose-50 text-rose-600 rounded text-[10px] font-bold">Baixo Estoque</span>' : ''}</td>
                                            <td class="p-4 font-mono font-bold">${i.qtd} u</td>
                                            <td class="p-4 text-xs text-slate-500">C: R$ ${i.custo.toFixed(2)}<br>V: R$ ${i.venda.toFixed(2)}</td>
                                            <td class="p-4 text-right space-x-1">
                                                <button onclick="alterarEstoque(${i.id}, 1)" class="p-1 px-2 bg-slate-100 hover:bg-slate-200 rounded font-bold text-xs">+</button>
                                                <button onclick="alterarEstoque(${i.id}, -1)" class="p-1 px-2 bg-slate-100 hover:bg-slate-200 rounded font-bold text-xs">-</button>
                                                <button onclick="excluirProduto(${i.id})" class="p-1 px-2 bg-rose-50 text-rose-600 hover:bg-rose-100 rounded text-xs"><i class="fa-solid fa-trash"></i></button>
                                            </td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm h-fit">
                            <h4 class="text-sm font-bold text-slate-700 mb-4">Adicionar Novo Produto</h4>
                            <form onsubmit="adicionarProduto(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Nome do Produto</label>
                                    <input type="text" id="p_nome" required class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm">
                                </div>
                                <div class="grid grid-cols-3 gap-2">
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 mb-1">Qtd Inicial</label>
                                        <input type="number" id="p_qtd" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 mb-1">Custo</label>
                                        <input type="number" step="0.01" id="p_custo" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
                                    </div>
                                    <div>
                                        <label class="block text-xs font-semibold text-slate-500 mb-1">Venda</label>
                                        <input type="number" step="0.01" id="p_venda" required class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
                                    </div>
                                </div>
                                <button type="submit" class="w-full py-2.5 text-white bg-slate-800 rounded-xl font-bold hover:bg-slate-700 transition text-sm">Adicionar Produto</button>
                            </form>
                        </div>
                    </div>
                `;
            }

            if (telaAtiva === "agendamentos") {
                return `
                    <div class="mb-8 flex justify-between items-center">
                        <div>
                            <h2 class="text-2xl font-bold text-slate-800">Próximos Agendamentos</h2>
                            <p class="text-sm text-slate-500">Controle a agenda de procedimentos confirmados.</p>
                        </div>
                        <a href="${window.location.href.split('?')[0]}?view=agendar" target="_blank" class="px-4 py-2 text-xs font-bold text-white bg-pink-600 rounded-xl shadow hover:bg-pink-500 transition"><i class="fa-solid fa-link mr-1"></i> Ver Link de Agendamento</a>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                                    <th class="p-4">Cliente / Whats</th>
                                    <th class="p-4">Procedimento</th>
                                    <th class="p-4">Data / Hora</th>
                                    <th class="p-4">Order Bump?</th>
                                    <th class="p-4 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${db.agendamentos.length === 0 ? '<tr><td colspan="5" class="p-8 text-center text-slate-400">Nenhum agendamento pendente.</td></tr>' : db.agendamentos.map(a => `
                                    <tr>
                                        <td class="p-4">
                                            <div class="font-bold text-slate-800">${a.cliente}</div>
                                            <div class="text-xs text-slate-400">${a.whatsapp}</div>
                                        </td>
                                        <td class="p-4"><span class="px-2.5 py-1 bg-amber-50 text-amber-800 rounded-full text-xs font-semibold">${a.procedimento}</span></td>
                                        <td class="p-4 font-medium text-slate-600">${a.data.split('-').reverse().join('/')} às ${a.horario}</td>
                                        <td class="p-4">${a.bump ? '<span class="px-2 py-0.5 bg-pink-50 text-pink-600 rounded text-[11px] font-bold"><i class="fa-solid fa-fire mr-1"></i>Protetor Solar</span>' : '<span class="text-slate-300">-</span>'}</td>
                                        <td class="p-4 text-right space-x-1">
                                            <button onclick="concluirAgendamento(${a.id})" class="px-3 py-1 bg-emerald-50 text-emerald-700 hover:bg-emerald-100 rounded-xl text-xs font-bold"><i class="fa-solid fa-check mr-1"></i>Concluir</button>
                                            <button onclick="excluirAgendamento(${a.id})" class="p-1 px-2.5 bg-slate-50 text-slate-400 hover:bg-rose-50 hover:text-rose-600 rounded-xl text-xs"><i class="fa-solid fa-xmark"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            if (telaAtiva === "marketing") {
                return `
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-slate-800">Retenção e Fidelização Inteligente</h2>
                        <p class="text-sm text-slate-500">Clientes inativos identificados para ação automática via WhatsApp.</p>
                    </div>
                    <div class="bg-white rounded-2xl border border-slate-100 shadow-sm overflow-hidden">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 border-b border-slate-100 text-[11px] font-bold text-slate-400 uppercase tracking-wider">
                                    <th class="p-4">Cliente</th>
                                    <th class="p-4">Último Procedimento</th>
                                    <th class="p-4">Tempo de Inatividade</th>
                                    <th class="p-4 text-right">Ação</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-sm">
                                ${db.clientesInativos.map(c => `
                                    <tr>
                                        <td class="p-4 font-bold text-slate-800">${c.nome}</td>
                                        <td class="p-4 text-slate-600">${c.ultimoProcedimento}</td>
                                        <td class="p-4"><span class="px-2 py-1 bg-rose-50 text-rose-700 font-semibold rounded text-xs">${c.dias} dias sumido(a)</span></td>
                                        <td class="p-4 text-right">
                                            <button onclick="dispararWhatsApp('${c.nome}', '${c.whatsapp}', '${c.ultimoProcedimento}', ${c.dias})" class="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center gap-1 ml-auto transition">
                                                <i class="fa-brands fa-whatsapp text-sm"></i> Chamar para Retornar
                                            </button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                `;
            }

            if (telaAtiva === "config") {
                return `
                    <div class="mb-8">
                        <h2 class="text-2xl font-bold text-slate-800">Configurações do Sistema</h2>
                        <p class="text-sm text-slate-500">Segurança da licença local e rotinas de backup.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm">
                            <h4 class="text-sm font-bold text-slate-700 mb-4">Credenciais de Acesso</h4>
                            <form onsubmit="atualizarConfiguracoes(event)" class="space-y-4">
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Usuário Master</label>
                                    <input type="text" id="cfg_user" value="${db.config.usuario}" required class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Senha Master</label>
                                    <input type="password" id="cfg_pass" value="${db.config.senha}" required class="w-full px-4 py-2 border border-slate-200 rounded-xl text-sm">
                                </div>
                                <div>
                                    <label class="block text-xs font-semibold text-slate-500 mb-1">Chave SaaS Local</label>
                                    <input type="text" id="cfg_key" value="${db.config.chave}" required class="w-full px-4 py-2 border border-slate-200 rounded-xl font-mono text-sm tracking-wider text-amber-700">
                                </div>
                                <button type="submit" class="w-full py-2.5 text-white bg-slate-800 rounded-xl font-bold hover:bg-slate-700 transition text-sm">Atualizar Dados</button>
                            </form>
                        </div>
                        <div class="bg-white p-6 rounded-2xl border border-slate-100 shadow-sm flex flex-col justify-between">
                            <div>
                                <h4 class="text-sm font-bold text-slate-700 mb-2">Cópia de Segurança (Backup)</h4>
                                <p class="text-xs text-slate-500 leading-relaxed">Como esta aplicação roda 100% no seu navegador sem servidores externos custosos, todos os seus agendamentos, estoque e caixa ficam salvos localmente de forma ultra segura. Exporte o arquivo periodicamente para garantir total segurança contra perdas involuntárias.</p>
                            </div>
                            <button onclick="realizarBackup()" class="w-full mt-6 py-3 bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow transition text-sm flex items-center justify-center gap-2">
                                <i class="fa-solid fa-download"></i> Baixar Arquivo JSON de Backup
                            </button>
                        </div>
                    </div>
                `;
            }
            return '';
        }

        function inicializarGrafico(db) {
            const ctx = document.getElementById('financeiroChart');
            if (!ctx) return;
            if (graficoInstancia) graficoInstancia.destroy();
            
            let totalEntradas = 0;
            let totalSaidas = 0;
            db.financeiro.forEach(m => {
                if (m.tipo === 'entrada') totalEntradas += m.valor;
                else totalSaidas += m.valor;
            });

            graficoInstancia = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Faturamento', 'Despesas'],
                    datasets: [{
                        data: [totalEntradas, totalSaidas],
                        backgroundColor: ['#0D4AF3', '#FF43F5'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 11, weight: 'bold' } } }
                    }
                }
            });
        }

        window.onload = function() {
            renderizarApp();
        };
    </script>
</body>
</html>
