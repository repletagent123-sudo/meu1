<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética Click - Sistema de Gestão Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap');
        
        * { font-family: 'Inter', sans-serif; }
        
        .gold-gradient { 
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 50%, #AA7C11 100%); 
        }
        .gold-gradient:hover {
            background: linear-gradient(135deg, #E5C048 0%, #C9970C 50%, #BB8D1A 100%);
        }
        .gold-text { 
            background: linear-gradient(135deg, #D4AF37, #B8860B); 
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            background-clip: text;
        }
        .sidebar-active { 
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.12) 0%, transparent 100%); 
            color: #B8860B; 
            font-weight: 700; 
            border-left: 3px solid #D4AF37;
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(20px); 
            border: 1px solid rgba(212, 175, 55, 0.08);
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        .dark-glass {
            background: linear-gradient(145deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid rgba(212, 175, 55, 0.1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .hover-lift { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .hover-lift:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.12);
        }
        .btn-gold {
            background: linear-gradient(135deg, #D4AF37 0%, #B8860B 100%);
            color: white;
            transition: all 0.3s ease;
        }
        .btn-gold:hover {
            background: linear-gradient(135deg, #E5C048 0%, #C9970C 100%);
            transform: translateY(-1px);
            box-shadow: 0 8px 24px rgba(212, 175, 55, 0.35);
        }
        .modal-overlay {
            animation: fadeIn 0.2s ease-out;
        }
        .modal-content {
            animation: slideUp 0.3s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px) scale(0.96); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .pulse-gold {
            animation: pulseGold 2s infinite;
        }
        @keyframes pulseGold {
            0%, 100% { box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4); }
            50% { box-shadow: 0 0 0 8px rgba(212, 175, 55, 0); }
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .table-row-hover:hover {
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.04) 0%, transparent 100%);
        }
        .badge-entrada {
            background: linear-gradient(135deg, #10b981, #059669);
            color: white;
        }
        .badge-saida {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: white;
        }
        .input-gold:focus {
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.15);
        }
    </style>
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <div id="toast-container" class="fixed top-5 right-5 z-[60] space-y-3 pointer-events-none"></div>
    <div id="modal-container" class="fixed inset-0 z-[55] hidden"></div>
    <div id="app" class="min-h-screen flex flex-col justify-between"></div>

    <script>
        // ==========================================
        // 1. ESTRUTURA DO BANCO DE DADOS LOCAL
        // ==========================================
        const DADOS_MOCK = {
            config: { usuario: "admin", senha: "123", chave: "ESTETICA2026", autenticado: false },
            financeiro: [
                { id: 1, descricao: "Procedimento Botox - Ana Silva", tipo: "entrada", valor: 1200.00, data: "2026-06-05" },
                { id: 2, descricao: "Preenchimento Labial (+ Protetor Bump)", tipo: "entrada", valor: 1549.90, data: "2026-06-06" },
                { id: 3, descricao: "Compra de Luvas e Microagulhas", tipo: "saida", valor: 150.00, data: "2026-06-07" },
                { id: 4, descricao: "Limpeza de Pele - Maria Souza", tipo: "entrada", valor: 180.00, data: "2026-06-08" }
            ],
            estoque: [
                { id: 1, nome: "Toxina Botulínica (Botox)", qtd: 5, custo: 450.00, venda: 1200.00 },
                { id: 2, nome: "Ácido Hialurônico 1ml", qtd: 2, custo: 300.00, venda: 1500.00 },
                { id: 3, nome: "Protetor Solar Facial Premium", qtd: 14, custo: 25.00, venda: 49.90 },
                { id: 4, nome: "Creme Hidratante Calmante", qtd: 1, custo: 40.00, venda: 90.00 }
            ],
            agendamentos: [
                { id: 1, cliente: "Ana Silva", whatsapp: "5511999999999", procedimento: "Botox", data: "2026-06-09", horario: "14:00", bump: false },
                { id: 2, cliente: "Maria Souza", whatsapp: "5511988888888", procedimento: "Limpeza de Pele", data: "2026-06-09", horario: "16:00", bump: true }
            ],
            clientes: [
                { id: 1, nome: "Ana Silva", whatsapp: "5511999999999", email: "ana@email.com", dataCadastro: "2026-01-15", historico: "Botox, Limpeza" },
                { id: 2, nome: "Maria Souza", whatsapp: "5511988888888", email: "maria@email.com", dataCadastro: "2026-02-20", historico: "Limpeza de Pele" },
                { id: 3, nome: "Juliana Ribeiro", whatsapp: "5511977777777", email: "ju@email.com", dataCadastro: "2026-03-10", historico: "Preenchimento" },
                { id: 4, nome: "Carla Mendes", whatsapp: "5511966666666", email: "carla@email.com", dataCadastro: "2026-04-05", historico: "Limpeza de Pele" }
            ],
            clientesInativos: [
                { id: 1, nome: "Juliana Ribeiro", whatsapp: "5511977777777", ultimoProcedimento: "Preenchimento", dias: 45 },
                { id: 2, nome: "Carla Mendes", whatsapp: "5511966666666", ultimoProcedimento: "Limpeza de Pele", dias: 32 }
            ]
        };

        const PRECOS_PROCEDIMENTOS = {
            "Botox": 1200.00,
            "Preenchimento": 1500.00,
            "Limpeza de Pele": 180.00,
            "Massagem": 120.00
        };

        function lerDB() {
            if (!localStorage.getItem('estetica_click_db_v2')) {
                localStorage.setItem('estetica_click_db_v2', JSON.stringify(DADOS_MOCK));
            }
            return JSON.parse(localStorage.getItem('estetica_click_db_v2'));
        }

        function gravarDB(dados) {
            localStorage.setItem('estetica_click_db_v2', JSON.stringify(dados));
        }

        let telaAtiva = "dashboard";
        let graficoInstancia = null;
        let itemEditando = null;

        function navegar(tela) {
            telaAtiva = tela;
            renderizarApp();
        }

        function mostrarToast(mensagem, tipo = "sucesso") {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            const cores = tipo === "sucesso" 
                ? "bg-emerald-50 border-emerald-300 text-emerald-800" 
                : tipo === "aviso"
                ? "bg-amber-50 border-amber-300 text-amber-800"
                : "bg-rose-50 border-rose-300 text-rose-800";
            const icone = tipo === "sucesso" ? "fa-circle-check" : tipo === "aviso" ? "fa-triangle-exclamation" : "fa-circle-exclamation";
            toast.className = `p-4 rounded-2xl shadow-2xl border text-sm font-semibold flex items-center gap-3 transition-all duration-400 transform translate-y-4 opacity-0 pointer-events-auto min-w-[300px] ${cores}`;
            toast.innerHTML = `<i class="fa-solid ${icone} text-lg"></i> <span>${mensagem}</span>`;
            container.appendChild(toast);
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => { toast.remove(); }, 400);
            }, 4000);
        }

        function abrirModal(html) {
            const modal = document.getElementById('modal-container');
            modal.innerHTML = `<div class="modal-overlay absolute inset-0" onclick="fecharModal()"></div><div class="modal-content relative bg-white rounded-3xl shadow-2xl max-w-lg w-full mx-4 max-h-[90vh] overflow-y-auto border border-slate-100">${html}</div>`;
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        }

        function fecharModal() {
            const modal = document.getElementById('modal-container');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            itemEditando = null;
        }

        // ==========================================
        // 2. AUTENTICAÇÃO E AGENDAMENTO PÚBLICO
        // ==========================================
        function executarLogin(event) {
            event.preventDefault();
            const u = document.getElementById('l_user').value;
            const s = document.getElementById('l_pass').value;
            const k = document.getElementById('l_key').value;
            const db = lerDB();

            if (u === db.config.usuario && s === db.config.senha && k === db.config.chave) {
                db.config.autenticado = true;
                gravarDB(db);
                mostrarToast("Licença SaaS validada com sucesso!");
                renderizarApp();
            } else {
                mostrarToast("Usuário, senha ou chave inválidos!", "erro");
            }
        }

        function executarLogout() {
            const db = lerDB();
            db.config.autenticado = false;
            gravarDB(db);
            renderizarApp();
        }

        function gravarAgendamentoCliente(event) {
            event.preventDefault();
            const db = lerDB();
            const nome = document.getElementById('c_nome').value;
            const whats = document.getElementById('c_whats').value.replace(/\D/g, '');
            
            let clienteExistente = db.clientes.find(c => c.whatsapp === whats || c.nome.toLowerCase() === nome.toLowerCase());
            if (!clienteExistente) {
                db.clientes.push({
                    id: Date.now(),
                    nome: nome,
                    whatsapp: whats,
                    email: "",
                    dataCadastro: new Date().toISOString().split('T')[0],
                    historico: document.getElementById('c_proc').value
                });
            }

            const novoAgendamento = {
                id: Date.now(),
                cliente: nome,
                whatsapp: whats,
                procedimento: document.getElementById('c_proc').value,
                data: document.getElementById('c_data').value,
                horario: document.getElementById('c_hora').value,
                bump: document.getElementById('c_bump').checked
            };

            db.agendamentos.push(novoAgendamento);
            gravarDB(db);
            mostrarToast("Agendamento Premium Reservado com sucesso!");
            event.target.reset();
        }

        // ==========================================
        // 3. OPERAÇÕES DO BACKOFFICE ADMINISTRATIVO
        // ==========================================
        function adicionarProduto(event) {
            event.preventDefault();
            const db = lerDB();
            const novoItem = {
                id: Date.now(),
                nome: document.getElementById('p_nome').value,
                qtd: parseInt(document.getElementById('p_qtd').value),
                custo: parseFloat(document.getElementById('p_custo').value),
                venda: parseFloat(document.getElementById('p_venda').value)
            };
            db.estoque.push(novoItem);
            gravarDB(db);
            mostrarToast("Produto adicionado ao estoque!");
            renderizarApp();
        }

        function alterarEstoque(id, delta) {
            const db = lerDB();
            const item = db.estoque.find(i => i.id === id);
            if (item) {
                item.qtd = Math.max(0, item.qtd + delta);
                gravarDB(db);
                renderizarApp();
            }
        }

        function excluirProduto(id) {
            abrirModal(`
                <div class="p-8 text-center">
                    <div class="w-16 h-16 rounded-full bg-rose-100 flex items-center justify-center mx-auto mb-4">
                        <i class="fa-solid fa-trash-can text-rose-500 text-2xl"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Excluir Produto</h3>
                    <p class="text-slate-500 mb-6">Tem certeza que deseja remover este item do estoque? Esta ação não pode ser desfeita.</p>
                    <div class="flex gap-3 justify-center">
                        <button onclick="fecharModal()" class="px-6 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-semibold hover:bg-slate-200 transition">Cancelar</button>
                        <button onclick="confirmarExcluirProduto(${id})" class="px-6 py-2.5 rounded-xl bg-rose-500 text-white font-semibold hover:bg-rose-600 transition shadow-lg shadow-rose-200">Excluir</button>
                    </div>
                </div>
            `);
        }

        function confirmarExcluirProduto(id) {
            const db = lerDB();
            db.estoque = db.estoque.filter(i => i.id !== id);
            gravarDB(db);
            fecharModal();
            mostrarToast("Produto removido do estoque.");
            renderizarApp();
        }

        function editarProduto(id) {
            const db = lerDB();
            const item = db.estoque.find(i => i.id === id);
            if (!item) return;
            itemEditando = { tipo: 'produto', id: id };
            abrirModal(`
                <div class="p-6">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center text-white">
                            <i class="fa-solid fa-pen-to-square"></i>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-800">Editar Produto</h3>
                            <p class="text-xs text-slate-400">Altere os dados do item</p>
                        </div>
                    </div>
                    <form onsubmit="salvarEdicaoProduto(event, ${id})" class="space-y-4">
                        <div>
                            <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Nome do Produto</label>
                            <input type="text" id="edit_p_nome" value="${item.nome}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none input-gold transition text-sm">
                        </div>
                        <div class="grid grid-cols-3 gap-3">
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Qtd</label>
                                <input type="number" id="edit_p_qtd" value="${item.qtd}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none input-gold transition text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Custo (R$)</label>
                                <input type="number" step="0.01" id="edit_p_custo" value="${item.custo}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none input-gold transition text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Venda (R$)</label>
                                <input type="number" step="0.01" id="edit_p_venda" value="${item.venda}" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:outline-none input-gold transition text-sm">
                            </div>
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="fecharModal()" class="flex-1 px-4 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-semibold hover:bg-slate-200 transition">Cancelar</button>
                            <button type="submit" class="flex-1 px-4 py-2.5 rounded-xl btn-gold font-semibold shadow-lg">Salvar Alterações</button>
                        </div>
                    </form>
                </div>
            `);
        }

        function salvarEdicaoProduto(event, id) {
            event.preventDefault();
            const db = lerDB();
            const item = db.estoque.find(i => i.id === id);
            if (item) {
                item.nome = document.getElementById('edit_p_nome').value;
                item.qtd = parseInt(document.getElementById('edit_p_qtd').value);
                item.custo = parseFloat(document.getElementById('edit_p_custo').value);
                item.venda = parseFloat(document.getElementById('edit_p_venda').value);
                gravarDB(db);
                fecharModal();
                mostrarToast("Produto atualizado com sucesso!");
                renderizarApp();
            }
        }

        function excluirMovimento(id) {
            abrirModal(`
                <div class="p-8 text-center">
                    <div class="w-16 h-16 rounded-full bg-rose-100 flex items-center justify-center mx-auto mb-4">
                        <i class="fa-solid fa-trash-can text-rose-500 text-2xl"></i>
                    </div>
                    <h3 class="text-xl font-bold text-slate-800 mb-2">Excluir Lançamento</h3>
                    <p class="text-slate-500 mb-6">Tem certeza que deseja remover esta movimentação financeira? Esta ação não pode ser desfeita.</p>
                    <div class="flex gap-3 justify-center">
                        <button onclick="fecharModal()" class="px-6 py-2.5 rounded-xl bg-slate-100 text-slate-600 font-semibold hover:bg-slate-200 transition">Cancelar</button>
                        <button onclick="confirmarExcluirMovimento(${id})" class="px-6 py-2.5 rounded-xl bg-rose-500 text-white font-semibold hover:bg-rose-600 transition shadow-lg shadow-rose-200">Excluir</button>
                    </div>
                </div>
            `);
        }

        function confirmarExcluirMovimento(id) {
            const db = lerDB();
            db.financeiro = db.financeiro.filter(m => m.id !== id);
            gravarDB(db);
            fecharModal();
            mostrarToast("Movimentação financeira excluída!");
            renderizarApp();
        }

        function editarMovimento(i
