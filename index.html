<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estética Click - Sistema de Gestão Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .gold-gradient { background: linear-gradient(135deg, #D4AF37 0%, #AA7C11 100%); }
        .sidebar-active { background-color: rgba(212, 175, 55, 0.1); color: #D4AF37; font-weight: bold; border-left: 4px solid #D4AF37; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body class="bg-slate-950 font-sans text-slate-100 antialiased min-h-screen">

    <div id="toast-container" class="fixed top-5 right-5 z-50 space-y-3 pointer-events-none"></div>
    <div id="app" class="min-h-screen flex flex-col justify-between"></div>

    <script>
        // ==========================================
        // 1. ESTRUTURA DO BANCO DE DADOS LOCAL
        // ==========================================
        const DADOS_MOCK = {
            config: { usuario: "admin", senha: "123", chave: "ESTETICA2026", autenticado: false },
            financeiro: [
                { id: 1, descricao: "Procedimento Botox - Ana Silva", tipo: "entrada", valor: 1200.00, data: "2026-06-05" },
                { id: 2, descricao: "Preenchimento Labial (+ Protetor Bump)", tipo: "entrada", valor: 1549.90, data: "2026-06-06" },
                { id: 3, descricao: "Compra de Luvas e Microagulhas", tipo: "saida", valor: 150.00, data: "2026-06-07" },
                { id: 4, descricao: "Limpeza de Pele - Maria Souza", tipo: "entrada", valor: 180.00, data: "2026-06-08" }
            ],
            estoque: [
                { id: 1, nome: "Toxina Botulínica (Botox)", qtd: 5, custo: 450.00, venda: 1200.00 },
                { id: 2, nome: "Ácido Hialurônico 1ml", qtd: 2, custo: 300.00, venda: 1500.00 },
                { id: 3, nome: "Protetor Solar Facial Premium", qtd: 14, custo: 25.00, venda: 49.90 },
                { id: 4, nome: "Creme Hidratante Calmante", qtd: 1, custo: 40.00, venda: 90.00 }
            ],
            agendamentos: [
                { id: 1, cliente: "Ana Silva", whatsapp: "5511999999999", procedimento: "Botox", data: "2026-06-09", horario: "14:00", bump: false },
                { id: 2, cliente: "Maria Souza", whatsapp: "5511988888888", procedimento: "Limpeza de Pele", data: "2026-06-09", horario: "16:00", bump: true }
            ],
            clientesInativos: [
                { id: 1, nome: "Juliana Ribeiro", whatsapp: "5511977777777", ultimoProcedimento: "Preenchimento", dias: 45 },
                { id: 2, nome: "Carla Mendes", whatsapp: "5511966666666", ultimoProcedimento: "Limpeza de Pele", dias: 32 }
            ]
        };

        const PRECOS_PROCEDIMENTOS = {
            "Botox": 1200.00,
            "Preenchimento": 1500.00,
            "Limpeza de Pele": 180.00,
            "Massagem": 120.00
        };

        function lerDB() {
            if (!localStorage.getItem('estetica_click_db')) {
                localStorage.setItem('estetica_click_db', JSON.stringify(DADOS_MOCK));
            }
            return JSON.parse(localStorage.getItem('estetica_click_db'));
        }

        function gravarDB(dados) {
            localStorage.setItem('estetica_click_db', JSON.stringify(dados));
        }

        let telaAtiva = "dashboard";
        let graficoInstancia = null;

        function navegar(tela) {
            telaAtiva = tela;
            renderizarApp();
        }

        function mostrarToast(mensagem, tipo = "sucesso") {
            const container = document.getElementById('toast-container');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `p-4 rounded-xl shadow-xl border text-sm font-semibold flex items-center gap-3 transition-all duration-300 transform translate-y-2 pointer-events-auto min-w-[280px] ${
                tipo === "sucesso" ? "bg-slate-900 border-emerald-500 text-emerald-400" : "bg-slate-900 border-rose-500 text-rose-400"
            }`;
            const icone = tipo === "sucesso" ? "fa-circle-check" : "fa-circle-exclamation";
            toast.innerHTML = `<i class="fa-solid ${icone} text-lg"></i> <span>${mensagem}</span>`;
            container.appendChild(toast);
            setTimeout(() => { toast.classList.remove('translate-y-2'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', '-translate-y-2');
                setTimeout(() => { toast.remove(); }, 300);
            }, 3500);
        }

        // ==========================================
        // 2. AUTENTICAÇÃO E AGENDAMENTO PÚBLICO
        // ==========================================
        function executarLogin(event) {
            event.preventDefault();
            const u = document.getElementById('l_user').value;
            const s = document.getElementById('l_pass').value;
            const k = document.getElementById('l_key').value;
            const db = lerDB();

            if (u === db.config.usuario && s === db.config.senha && k === db.config.chave) {
                db.config.autenticado = true;
                gravarDB(db);
                mostrarToast("Licença SaaS validada com sucesso!");
                renderizarApp();
            } else {
                mostrarToast("Usuário, senha ou chave inválidos!", "erro");
            }
        }

        function executarLogout() {
            const db = lerDB();
            db.config.autenticado = false;
            gravarDB(db);
            renderizarApp();
        }

        function gravarAgendamentoCliente(event) {
            event.preventDefault();
            const db = lerDB();
            
            const novoAgendamento = {
                id: Date.now(),
                cliente: document.getElementById('c_nome').value,
                whatsapp: document.getElementById('c_whats').value.replace(/\D/g, ''),
                procedimento: document.getElementById('c_proc').value,
                data: document.getElementById('c_data').value,
                horario: document.getElementById('c_hora').value,
                bump: document.getElementById('c_bump').checked
            };

            db.agendamentos.push(novoAgendamento);
            gravarDB(db);
            
            mostrarToast("Agendamento Premium Reservado com sucesso!");
            event.target.reset();
        }

        // ==========================================
        // 3. OPERAÇÕES DO BACKOFFICE ADMINISTRATIVO
        // ==========================================
        function adicionarProduto(event) {
            event.preventDefault();
            const db = lerDB();
            const novoItem = {
                id: Date.now(),
                nome: document.getElementById('p_nome').value,
                qtd: parseInt(document.getElementById('p_qtd').value),
                custo: parseFloat(document.getElementById('p_custo').value),
                venda: parseFloat(document.getElementById('p_venda').value)
            };
            db.estoque.push(novoItem);
            gravarDB(db);
            mostrarToast("Produto adicionado ao estoque!");
            renderizarApp();
        }

        function alterarEstoque(id, delta) {
            const db = lerDB();
            const item = db.estoque.find(i => i.id === id);
            if (item) {
                item.qtd = Math.max(0, item.qtd + delta);
                gravarDB(db);
                renderizarApp();
            }
        }

        function excluirProduto(id) {
            const db = lerDB();
            db.estoque = db.estoque.filter(i => i.id !== id);
            gravarDB(db);
            mostrarToast("Produto removido do estoque.");
            renderizarApp();
        }

        function excluirMovimento(id) {
            const db = lerDB();
            db.financeiro = db.financeiro.filter(m => m.id !== id);
            gravarDB(db);
            mostrarToast("Movimentação financeira excluída!");
            renderizarApp();
        }

        function concluirAgendamento(id) {
            const db = lerDB();
            const idx = db.agendamentos.findIndex(a => a.id === id);
            if (idx === -1) return;
            
            const agendamento = db.agendamentos[idx];
            const valorBase = PRECOS_PROCEDIMENTOS[agendamento.procedimento] || 100.00;
            
            db.financeiro.push({
                id: Date.now(),
                descricao: `Procedimento ${agendamento.procedimento} - ${agendamento.cliente}`,
                tipo: "entrada",
                valor: valorBase,
                data: new Date().toISOString().split('T')[0]
            });

            if (agendamento.bump) {
                db.financeiro.push({
                    id: Date.now() + 1,
                    descricao: `Venda Order Bump - Protetor Solar (${agendamento.cliente})`,
                    tipo: "entrada",
                    valor: 49.90,
                    data: new Date().toISOString().split('T')[0]
                });

                const protetor = db.estoque.find(i => i.id === 3 || i.nome.includes("Protetor"));
                if (protetor && protetor.qtd > 0) {
                    protetor.qtd -= 1;
                }
            }

            db.clientesInativos.push({
                id: Date.now(),
                nome: agendamento.cliente,
                whatsapp: agendamento.whatsapp,
                ultimoProcedimento: agendamento.procedimento,
                dias: 1
            });

            db.agendamentos.splice(idx, 1);
            gravarDB(db);
            mostrarToast("Atendimento finalizado e computado no caixa!");
            renderizarApp();
        }

        function excluirAgendamento(id) {
            const db = lerDB();
            db.agendamentos = db.agendamentos.filter(a => a.id !== id);
            gravarDB(db);
            mostrarToast("Agendamento removido.");
            renderizarApp();
        }

        function adicionarClienteCampanha(event) {
            event.preventDefault();
            const db = lerDB();
            const novoCliente = {
                id: Date.now(),
                nome: document.getElementById('mk_nome').value,
                whatsapp: document.getElementById('mk_whats').value.replace(/\D/g, ''),
                ultimoProcedimento: document.getElementById('mk_proc').value,
                dias: parseInt(document.getElementById('mk_dias').value)
            };
            db.clientesInativos.push(novoCliente);
            gravarDB(db);
            mostrarToast("Cliente inserido na carteira de retenção!");
            renderizarApp();
        }

        function excluirClienteInativo(id) {
            const db = lerDB();
            db.clientesInativos = db.clientesInativos.filter(c => c.id !== id);
            gravarDB(db);
            mostrarToast("Cliente removido da lista.");
            renderizarApp();
        }

        function dispararWhatsApp(nome, whats, procedimento, dias) {
            const texto = `Olá ${nome}! Tudo bem? Notamos aqui no sistema que faz ${dias} dias desde o seu último procedimento de ${procedimento}. O visual deve estar precisando de uma renovação! Garanta seu horário exclusivo clicando no nosso link de agendamento online: ${window.location.href.split('?')[0]}?view=agendar`;
            const url = `https://api.whatsapp.com/send?phone=${whats}&text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        function adicionarMovimentoManual(event) {
            event.preventDefault();
            const db = lerDB();
            db.financeiro.push({
                id: Date.now(),
                descricao: document.getElementById('f_desc').value,
                tipo: document.getElementById('f_tipo').value,
                valor: parseFloat(document.getElementById('f_valor').value),
                data: document.getElementById('f_data').value
            });
            gravarDB(db);
            mostrarToast("Movimentação de caixa lançada!");
            renderizarApp();
        }

        function atualizarConfiguracoes(event) {
            event.preventDefault();
            const db = lerDB();
            db.config.usuario = document.getElementById('cfg_user').value;
            db.config.senha = document.getElementById('cfg_pass').value;
            db.config.chave = document.getElementById('cfg_key').value;
            gravarDB(db);
            mostrarToast("Configurações atualizadas com sucesso!");
            renderizarApp();
        }

        function realizarBackup() {
            const db = lerDB();
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(db));
            const dlAnchorElem = document.createElement('a');
            dlAnchorElem.setAttribute("href", dataStr);
            dlAnchorElem.setAttribute("download", `backup_estetica_click.json`);
            dlAnchorElem.click();
        }

        // ==========================================
        // 4. RENDERIZADOR DO CORE DA APLICAÇÃO
        // ==========================================
        function renderizarApp() {
            const container = document.getElementById('app');
            const urlParams = new URLSearchParams(window.location.search);
            const modoPublico = urlParams.get('view') === 'agendar';
            const db = lerDB();

            if (modoPublico) {
                container.innerHTML = obterLayoutCliente();
                return;
            }

            if (!db.config.autenticado) {
                container.innerHTML = obterLayoutLogin();
                return;
            }

            container.innerHTML = `
                <div class="flex flex-col md:flex-row min-h-screen bg-slate-950">
                    <aside class="w-full md:w-64 bg-slate-900/60 border-r border-slate-800/80 backdrop-blur-md flex flex-col justify-between z-10">
                        <div>
                            <div class="p-6 border-b border-slate-800/60 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center text-slate-950 shadow-md">
                                    <i class="fa-solid fa-sparkles text-lg"></i>
                                </div>
                                <div>
                                    <h1 class="font-bold text-base text-slate-100 leading-tight">Estética Click</h1>
                                    <span class="text-[10px] font-bold text-amber-500 tracking-wider uppercase">Gestão Premium</span>
                                </div>
                            </div>
                            <nav class="mt-6 px-3 space-y-1">
                                <button onclick="navegar('dashboard')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 text-sm text-left transition ${telaAtiva === 'dashboard' ? 'sidebar-active' : 'hover:bg-slate-800/40 hover:text-slate-200'}">
                                    <i class="fa-solid fa-chart-pie w-5"></i> Dashboard
                                </button>
                                <button onclick="navegar('estoque')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 text-sm text-left transition ${telaAtiva === 'estoque' ? 'sidebar-active' : 'hover:bg-slate-800/40 hover:text-slate-200'}">
                                    <i class="fa-solid fa-boxes-stacked w-5"></i> Estoque
                                </button>
                                <button onclick="navegar('agendamentos')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 text-sm text-left transition ${telaAtiva === 'agendamentos' ? 'sidebar-active' : 'hover:bg-slate-800/40 hover:text-slate-200'}">
                                    <i class="fa-solid fa-calendar-days w-5"></i> Agendamentos
                                </button>
                                <button onclick="navegar('marketing')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 text-sm text-left transition ${telaAtiva === 'marketing' ? 'sidebar-active' : 'hover:bg-slate-800/40 hover:text-slate-200'}">
                                    <i class="fa-solid fa-comments-dollar w-5"></i> Retenção & Carteira
                                </button>
                                <button onclick="navegar('config')" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-slate-400 text-sm text-left transition ${telaAtiva === 'config' ? 'sidebar-active' : 'hover:bg-slate-800/40 hover:text-slate-200'}">
                                    <i class="fa-solid fa-sliders w-5"></i> Configurações & Backup
                                </button>
                            </nav>
                        </div>
                        <div class="p-4 border-t border-slate-800/60">
                            <button onclick="executarLogout()" class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-rose-400 hover:bg-rose-950/30 text-sm font-semibold transition text-left">
                                <i class="fa-solid fa-right-from-bracket"></i> Desconectar
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 p-6 md:p-8 overflow-y-auto">
                        ${obterConteudoAdmin(db)}
                    </main>
                </div>
            `;

            if (telaAtiva === "dashboard") {
                inicializarGrafico(db);
            }
        }

        // ==========================================
        // 5. LAYOUTS HTML DE SUPORTE
        // ==========================================
        function obterLayoutLogin() {
            return `
                <div class="min-h-screen flex items-center justify-center bg-slate-950 p-4" style="background-image: radial-gradient(circle at top right, rgba(212,175,55,0.08), transparent 45%);">
                    <div class="bg-slate-900 p-8 rounded-3xl shadow-2xl w-full max-w-sm border border-slate-800">
                        <div class="text-center mb-6">
                            <div class="w-14 h-14 rounded-2xl gold-gradient flex items-center justify-center text-slate-950 mx-auto shadow-md mb-3">
                                <i class="fa-solid fa-shield-halved text-xl"></i>
                            </div>
                            <h2 class="text-2xl font-bold text-slate-100">Acesso Restrito</h2>
                            <p class="text-xs text-slate-500 mt-1">Chave de licença ativa obrigatória</p>
                        </div>
                        <form onsubmit="executarLogin(event)" class="space-y-4">
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Usuário</label>
                                <input type="text" id="l_user" required class="w-full px-4 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm text-slate-100">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Senha</label>
                                <input type="password" id="l_pass" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm bg-slate-950 text-slate-100">
                            </div>
                            <div>
                                <label class="block text-[10px] font-bold uppercase tracking-wider text-slate-500 mb-1">Chave de Ativação SaaS</label>
                                <input type="text" id="l_key" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none font-mono text-sm tracking-widest text-amber-500 bg-slate-950">
                            </div>
                            <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-slate-950 gold-gradient shadow-lg hover:opacity-90 transition mt-2 cursor-pointer">
                                Verificar Assinatura
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function obterLayoutCliente() {
            return `
                <div class="min-h-screen flex flex-col items-center justify-center p-4 bg-slate-950" style="background-image: radial-gradient(circle at bottom left, rgba(212,175,55,0.05), transparent 45%);">
                    <div class="bg-slate-900 rounded-3xl shadow-xl w-full max-w-lg p-6 md:p-8 border border-slate-800">
                        <div class="text-center mb-6">
                            <span class="px-3 py-1 bg-amber-500/10 text-amber-400 rounded-full text-[10px] font-bold uppercase tracking-wider">Agendamento Online</span>
                            <h2 class="text-2xl font-black text-slate-100 mt-2">Estética Click</h2>
                            <p class="text-slate-400 text-xs mt-1">Selecione seu procedimento exclusivo e reserve seu horário.</p>
                        </div>
                        <form onsubmit="gravarAgendamentoCliente(event)" class="space-y-5">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Nome Completo</label>
                                    <input type="text" id="c_nome" required class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm text-slate-100">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">WhatsApp (com DDD)</label>
                                    <input type="tel" id="c_whats" required placeholder="Ex: 5511999999999" class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm text-slate-100">
                                </div>
                            </div>
                            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Data</label>
                                    <input type="date" id="c_data" required class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm text-slate-100">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Horário</label>
                                    <input type="time" id="c_hora" required class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm text-slate-100">
                                </div>
                                <div>
                                    <label class="block text-[10px] font-bold uppercase text-slate-500 mb-1">Procedimento</label>
                                    <select id="c_proc" required class="w-full px-3 py-2.5 bg-slate-950 border border-slate-800 rounded-xl focus:ring-2 focus:ring-amber-500 focus:outline-none transition text-sm text-slate-100">
                                        <option value="Botox">Toxina Botulínica (Botox) - R$ 1.200</option>
                                        <option value="Preenchimento">Preenchimento Labial - R$ 1.500</option>
                                        <option value="Limpeza de Pele">Limpeza de Pele - R$ 180</option>
                                        <option value="Massagem">Drenagem Linfática - R$ 120</option>
                                    </select>
                                </div>
                            </div>

                            <div class="bg-amber-500/5 border-2 border-dashed border-amber-500/30 rounded-2xl p-4 flex items-start gap-3 relative overflow-hidden shadow-sm">
                                <div class="absolute top-0 right-0 bg-amber-500 text-slate-950 font-bold text-[8px] uppercase px-2.5 py-0.5 rounded-bl-lg tracking-wider">Oferta Única</div>
                                <div class="mt-0.5">
                                    <input type="checkbox" id="c_bump" class="w-4 h-4 accent-amber-500 rounded cursor-pointer bg-slate-950 border-slate-800">
                                </div>
                                <div>
                                    <label for="c_bump" class="font-bold text-amber-400 block text-sm cursor-pointer">Adicionar Protetor Solar Facial Premium com 20% OFF?</label>
                                    <p class="text-[11px] text-slate-400 mt-0.5">Retire no balcão no dia do atendimento. De <span class="line-through">R$ 62,00</span> por <strong>apenas R$ 49,90!</strong></p>
                                </div>
                            </div>

                            <button type="submit" class="w-full py-3.5 rounded-xl font-bold text-slate-950 gold-gradient shadow-lg shadow-amber-500/10 hover:opacity-90 transition text-center text-base cursor-pointer">
                                Confirmar Agendamento Premium
                            </button>
                        </form>
                    </div>
                </div>
            `;
        }

        function obterConteudoAdmin(db) {
            let totalEntradas = 0;
            let totalSaidas = 0;
            db.financeiro.forEach(m => {
                if (m.tipo === 'entrada') totalEntradas += m.valor;
                else totalSaidas += m.valor;
            });
            let saldoLiquido = totalEntradas - totalSaidas;

            if (telaAtiva === "dashboard") {
                let linhasMov = db.financeiro.slice(-4).reverse().map(m => `
                    <tr class="border-b border-slate-800/40 text-sm hover:bg-slate-800/20 transition">
                        <td class="px-4 py-3.5 font-medium text-slate-200">${m.descricao}</td>

        // ==========================================
        // 6. INICIALIZADOR DO GRÁFICO (CHART.JS)
        // ==========================================
        function inicializarGrafico(db) {
            const ctx = document.getElementById('graficoFinanceiro');
            if (!ctx) return;

            if (graficoInstancia) {
                graficoInstancia.destroy();
            }

            let totalEntradas = 0;
            let totalSaidas = 0;
            db.financeiro.forEach(m => {
                if (m.tipo === 'entrada') totalEntradas += m.valor;
                else totalSaidas += m.valor;
            });

            graficoInstancia = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Faturamento', 'Despesas'],
                    datasets: [{
                        data: [totalEntradas, totalSaidas],
                        backgroundColor: ['#D4AF37', '#F43F5E'],
                        borderWidth: 0,
                        hoverOffset: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { boxWidth: 12, color: '#94a3b8', font: { size: 10, family: 'sans-serif' } }
                        }
                    },
                    cutout: '70%'
                }
            });
        }

        renderizarApp();
    </script>
</body>
</html>
